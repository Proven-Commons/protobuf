# Read by bar/check.py in Proven-Commons/mission.
# See playbook/verified-bar.md there for what each field means.

[project]
name = "protobuf"
# "in-progress" until every bar item passes, then "verified".
status = "in-progress"
page = "README.md"
# GitHub handles of everyone who wrote the specification. It was drafted
# by Claude, an AI agent, for the org. The agent commits as Claude
# <noreply@anthropic.com>, which GitHub shows as the login claude. It
# pushes its branches from the ahrazzle account, and opens pull requests
# and posts comments from ahrazzle and ibn-aska. So all three are listed.
spec_authors = ["ahrazzle", "claude", "ibn-aska"]
# The program people run. A change to it voids the approval.
entry_points = ["Main.lean"]

[spec]
# Protobuf/Types.lean holds the types every statement is about, so it
# is part of the specification.
files = ["SPEC.md", "Protobuf/Spec.lean", "Protobuf/Spec/Defs.lean", "Protobuf/Types.lean"]
# The code under proof: the functions the statements are about.
code = [
  "Protobuf.Varint.encode", "Protobuf.Varint.decode",
  "Protobuf.encode", "Protobuf.decode", "Protobuf.Field.isValid",
]

# One entry per approval, added in a pull request the reviewer approves.
# [[spec.approval]]
# reviewer = "github-handle"
# date = "2026-11-02"
# sha256 = "..."
# record = "https://github.com/Proven-Commons/protobuf/pull/<n>"

[tests]
results = "tests/TEST-RESULTS.md"
command = "python3 tests/run_tests.py"
files = ["tests/run_tests.py", "tests/planted_bugs.py"]
