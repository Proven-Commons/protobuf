name = "protobuf"
version = "0.1.0"
license = "Apache-2.0"
defaultTargets = ["Protobuf", "ProtobufSpec", "ProtobufProofs", "protowire"]

[[lean_lib]]
name = "Protobuf"

[[lean_lib]]
name = "ProtobufSpec"
roots = ["Protobuf.Spec"]

[[lean_lib]]
name = "ProtobufProofs"
roots = ["Protobuf.Proofs"]

[[lean_exe]]
name = "protowire"
root = "Main"
